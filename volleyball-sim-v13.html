<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11132b">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>女子バレー部監督シム v14</title>
<style>

:root{--bg:#22264d;--panel:#f6f1dc;--ink:#1a1a1a;--team:#d8343a;--accent:#ffd84a;--dark:#11132b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:linear-gradient(45deg,#262a55 25%,transparent 25%,transparent 75%,#262a55 75%),linear-gradient(45deg,#262a55 25%,transparent 25%,transparent 75%,#262a55 75%);background-size:16px 16px;background-position:0 0,8px 8px;font-family:"MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP",monospace;color:var(--ink);font-size:14px}
#app{max-width:1280px;margin:0 auto;padding:10px}
.px{background:var(--panel);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:10px;margin-bottom:12px}
.dark{background:var(--dark);color:#fff}
h1,h2,h3{margin:0 0 8px}
h2{font-size:18px;border-bottom:3px dashed #000;padding-bottom:4px}
button{font-family:inherit;font-size:14px;border:3px solid #000;background:var(--accent);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 #000;font-weight:bold;margin:2px}
button:hover{filter:brightness(1.08)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:disabled{background:#aaa;cursor:not-allowed}
button.sub{background:#fff}
button.red{background:#ff7b7b}
button.big{font-size:18px;padding:10px 20px}
button.on{background:#7be07b}
button.mini{font-size:12px;padding:3px 7px}
input,select{font-family:inherit;font-size:14px;border:3px solid #000;padding:4px;background:#fff}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--team);color:#fff;border:4px solid #000;box-shadow:4px 4px 0 #000;padding:8px 12px;margin-bottom:8px;text-shadow:2px 2px 0 #000}
.hdr .sch{font-size:20px;font-weight:bold}
.hdr .itm{background:rgba(0,0,0,.35);padding:3px 8px;border:2px solid #000}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.nav button.cur{background:#fff;outline:3px solid var(--team)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:280px}
/* board */
.board{display:grid;grid-template-columns:repeat(7,68px);grid-template-rows:repeat(7,62px);gap:3px;background:#000;border:4px solid #000;box-shadow:4px 4px 0 #000;width:max-content}
.tile{background:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;text-align:center;line-height:1.15}
.tile .ic{font-size:20px}
.tile.cur{outline:4px solid var(--team);outline-offset:-4px}
.tile.dest{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:#fff27a}}
.tile .me{position:absolute;top:1px;right:2px;font-size:16px}
.t-spike{background:#ffb3a7}.t-block{background:#c9b3ff}.t-receive{background:#a7d8ff}.t-serve{background:#ffe08a}.t-toss{background:#b8f0c4}.t-train{background:#ffc98a}.t-mental{background:#f7b3e0}.t-rest{background:#d9d9d9}.t-pmatch{background:#8ae0d8}.t-event{background:#fff}.t-equip{background:#e0d2b0}
.center{grid-row:2/7;grid-column:2/7;background:var(--panel);padding:10px;overflow:auto;font-size:13px}
.hand{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{width:92px;height:118px;border:4px solid #000;background:#fff;box-shadow:3px 3px 0 #000;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;user-select:none}
.card .n{font-size:40px;font-weight:bold;line-height:1}
.card.sel{transform:translateY(-8px);background:#fff27a}
.card.focus{background:#ffd0d0}.card.light{background:#d0ecff}.card.self{background:#e0ffd0}.card.all{background:#f0d8ff}
.card.sel.focus,.card.sel.light,.card.sel.self,.card.sel.all{background:#fff27a}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:2px solid #000;padding:3px 5px;text-align:center;white-space:nowrap}
th{background:#333;color:#fff}
tr.click:hover{background:#fff6b0;cursor:pointer}
tr.me td{background:#fff3a0;font-weight:bold}
.rk{display:inline-block;min-width:18px;font-weight:bold;padding:0 2px;border:2px solid #000;color:#fff;text-shadow:1px 1px 0 #000}
.rk-S{background:#e83a3a}.rk-A{background:#ff8c1a}.rk-B{background:#e6c200}.rk-C{background:#4cb84c}.rk-D{background:#3a9ad9}.rk-E{background:#6a6ad9}.rk-F{background:#888}.rk-G{background:#555}
.sm{font-size:12px;color:#555}
.tag{display:inline-block;border:2px solid #000;padding:0 4px;font-size:12px;background:#fff;margin:1px}
.inj{color:#c00;font-weight:bold}
.bar{height:8px;background:#ddd;border:2px solid #000;position:relative}
.bar i{display:block;height:100%;background:#4cb84c}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.hidden{display:none}
#modal .box{max-width:760px;width:100%;max-height:90vh;overflow:auto}
/* match */
.score{display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:bold}
.score .tm{padding:6px 12px;border:4px solid #000;color:#fff;text-shadow:2px 2px 0 #000;min-width:220px;text-align:center}
.score .pt{font-size:44px;background:#000;color:#ffe35a;padding:2px 14px;min-width:80px;text-align:center;font-family:monospace}
.score .st{font-size:24px}
.serve-dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #000;visibility:hidden}
.serve-dot.on{visibility:visible}
.log{height:210px;overflow:auto;background:#0b0d1e;color:#e8e8e8;border:4px solid #000;padding:8px;font-size:13px;line-height:1.6}
.log .u{color:#ffe35a}.log .o{color:#9ad0ff}.log .ss{color:#7be07b;font-weight:bold;border-top:2px dashed #555;margin-top:4px;padding-top:4px}
.log .key{background:#33204a}
.log .cmd{color:#ff9ad5;font-weight:bold}
#court{display:block;border:4px solid #000;box-shadow:4px 4px 0 #000;background:#f6e3bd;max-width:100%}
.mpanel{min-width:330px;max-width:420px}
.mpanel h3{font-size:14px;border-bottom:2px solid #000;margin:6px 0 4px}
.mpanel table td{font-size:12px;padding:2px 3px}
.tacs button{font-size:12px;padding:4px 6px}
.stb{display:inline-block;width:56px;height:8px;border:2px solid #000;background:#ddd;vertical-align:middle}
.stb i{display:block;height:100%}
.colors label{display:inline-flex;align-items:center;gap:4px;margin-right:8px;cursor:pointer}
.sw{display:inline-block;width:22px;height:22px;border:3px solid #000}
.chips span{display:inline-block;border:2px solid #000;background:#fff;padding:2px 6px;margin:2px;cursor:pointer}
.chips span:hover{background:#fff27a}
.title{text-align:center;padding:40px 10px}
.title h1{font-size:36px;color:#fff;text-shadow:4px 4px 0 #000;letter-spacing:2px}
.ball{font-size:64px;display:inline-block;animation:bounce .8s steps(4) infinite}
@keyframes bounce{50%{transform:translateY(-20px)}}
.note{background:#fff;border:2px solid #000;padding:6px;margin:4px 0}
.gain{color:#0a7d22;font-weight:bold}
.loss{color:#c00;font-weight:bold}
.nat{background:linear-gradient(90deg,#ffe35a,#ffb347)}
.sk{display:inline-block;border:2px solid #000;padding:0 4px;margin:1px;font-size:12px;font-weight:bold;white-space:nowrap}
.sk.sks{font-size:12px;padding:0 3px}
.sk-blue{background:#a7d8ff}.sk-gold{background:#ffd84a;box-shadow:inset 0 0 0 1px #fff}.sk-red{background:#ff9a9a}
.skc{display:inline-block;min-width:16px;border:2px solid #000;font-size:12px;font-weight:bold;margin:0 1px;padding:0 2px;text-align:center}
.skc.g{background:#ffd84a}.skc.b{background:#a7d8ff}.skc.r{background:#ff9a9a}
/* v5 calendar board */
.cal{display:grid;grid-template-columns:38px repeat(8,74px);gap:3px;background:#000;border:4px solid #000;box-shadow:4px 4px 0 #000;width:max-content}
.calm{background:#333;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.6}
.cell{background:#fff;height:60px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.15;text-align:center;padding-top:6px}
.cell .wk{position:absolute;top:1px;left:3px;font-size:10px;color:#666}
.cell .ic{font-size:18px;line-height:1}
.cell .sb{font-size:10px;color:#a00;font-weight:bold}
.cell .me{position:absolute;top:-2px;right:1px;font-size:15px}
.cell.past{background:#8a8a8a;opacity:.5}
.cell.hid{background:#c8c8c8;color:#555}
.cell.stop{background:#fff27a;box-shadow:inset 0 0 0 3px #000;font-weight:bold}
.cell.path{box-shadow:inset 0 0 0 4px #2f63d6}
.cell.cur{outline:4px solid var(--team);outline-offset:-4px}
.cell.land{animation:blink .45s steps(2) infinite}
.tt-good{background:#a7d8ff}.tt-bad{background:#ff9a9a}.tt-power{background:#ffb347}.tt-coach{background:#d9b3ff}.tt-rest{background:#b8f0c4}.tt-pmatch{background:#8ae0d8}.tt-equip{background:#e0d2b0}.tt-normal{background:#fff}
.card .ck{font-size:12px;font-weight:bold;text-align:center;line-height:1.2}
.card .cm{font-size:12px;font-weight:bold}
.card.m-focus{background:#ffd0d0}.card.m-light{background:#d0ecff}.card.m-self{background:#e0ffd0}.card.m-ob{background:#ffe0b0}.card.k-rest{background:#e4e4e4}
.card.sel{background:#fff27a !important}
.mtbl td.tg{outline:3px solid #e8541a;outline-offset:-3px;background:#fff1e0}
.mtbl select{font-size:12px;padding:2px}
.mtbl td{padding:2px 4px}
/* v10 day board */
.cal{display:grid;grid-template-columns:repeat(7,76px);gap:3px}
.cal .cell{height:64px}
.cell .wk{font-size:10px}
.cell.sat .wk{color:#2f63d6}.cell.sun .wk{color:#d33}
.card.act{background:#e9ddff;border-style:dashed}
.route{display:inline-flex;gap:3px;margin:4px 0}
.rt{display:inline-block;width:56px;text-align:center;border:2px solid #000;padding:2px;font-size:16px;line-height:1.1}
.rt small{font-size:10px}
.tt-tokkun{background:#d9b3ff}.tt-branch{background:#fff27a}.tt-person{background:#ffd0a8}
.card.up{box-shadow:3px 3px 0 #000,inset 0 0 0 3px #e8541a}
.card.up .ck{color:#b33c00}
.sta{display:inline-block;color:#fff;font-size:11px;padding:0 3px;border:2px solid #000;letter-spacing:-1px;text-shadow:1px 1px 0 #000}

/* v11-3 顔 */
.av{display:inline-block;vertical-align:middle;background:#fff8ec;border:2px solid #000;border-radius:8px;overflow:hidden;line-height:0;flex:none}
.av svg{display:block}
.av-q{width:30px;height:34px;line-height:30px;text-align:center;font-weight:bold;color:#888;background:#ddd}
td.nmc{text-align:left;white-space:nowrap}
.pt-face{display:inline-block;background:#fff8ec;border:3px solid #000;border-radius:10px;line-height:0;overflow:hidden}
label.fe{display:block;margin:4px 0}
label.fe select{min-width:150px}
#cutin{position:absolute;right:10px;top:40px;pointer-events:none;opacity:0;transform:translateX(30px);transition:opacity .2s,transform .2s}
#cutin.show{opacity:1;transform:translateX(0)}
#cutin .ci{background:#fff8ec;border:4px solid #000;box-shadow:4px 4px 0 #000;border-radius:12px;padding:4px 8px 6px;text-align:center;line-height:1.2}
#cutin .ci svg{display:block;margin:0 auto}
#cutin .ci-t{font-weight:bold;font-size:18px;color:#d8343a;text-shadow:1px 1px 0 #fff}
#cutin .ci-n{font-size:12px}
/* v13 フェーズ2：試合終了の演出とハイライト */
@keyframes fxpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.fx-win{animation:fxpop .5s ease-out}
.fx-lose{animation:fxpop .4s ease-out}
.win-sub{font-size:18px;font-weight:bold;text-align:center}
.hlbox{background:#fff;border:2px solid #000;padding:6px;font-size:12px;line-height:1.6}

/* v11-4 補正の一覧 */
table.mods td{font-size:12px;padding:2px 4px}
table.mods tr.off{opacity:.45}
table.mods tr.on td{background:#eaffea}

/* v11-5 */
.focusbox{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fcs{display:block;width:170px;background:#fff;border:3px solid #000;padding:6px;cursor:pointer;box-shadow:2px 2px 0 #000}
.fcs.on{background:#fff27a}.fcs.dis{opacity:.45;cursor:not-allowed}
.vs{height:12px;background:#9ad0ff;border:2px solid #000;position:relative}
.vs i{display:block;height:100%;background:var(--team)}
.mvp{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #000;padding:6px;margin:6px 0}
.ttl{color:#b33c00;font-weight:bold;font-size:12px}
.prof{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.prof span{background:#fff;border:2px solid #000;padding:1px 6px;font-size:12px}
.album h3{margin:8px 0 2px}
.agrid{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.acard{width:220px;background:#fffdf5;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px;text-align:center}
.aface{display:inline-block;background:linear-gradient(#cfe8ff,#fff8ec);border:2px solid #000;border-radius:10px;line-height:0;overflow:hidden}
.anm{font-size:17px;font-weight:bold;margin-top:4px}
.atl{color:#b33c00;font-weight:bold}
.awords{margin-top:6px;background:#fff3d6;border:2px dashed #b38b00;padding:4px;font-size:13px;text-align:left}


/* v12-1 交代 */
.subbox table td{font-size:12px;padding:2px 3px}
.subbox tr.ng td{opacity:.5}
.pair{display:inline-block;background:#fff3a0;border:2px solid #000;padding:0 4px;margin:2px 2px 0 0}
#mbreak h3{font-size:14px;margin:6px 0 4px}
#mbreak table td{font-size:12px;padding:2px 4px}

/* v12-2 データ分析 */
.mtabs{margin-bottom:4px}
.mpanel{overflow-x:auto}
table.antbl td,table.antbl th{font-size:12px;padding:2px 4px}
table.antbl tr.warn td{background:#ffe2e2}
.mpanel h4,#modal h4{font-size:13px;margin:6px 0 2px}
.advice{background:#fffbe0;border:2px solid #b38b00;padding:4px 6px;margin:4px 0;font-size:12px}
button.advd{outline:3px solid #b38b00}
.flow{margin:4px 0}
#modal .box.wide{max-width:1000px}
/* ===== v12-3 スマホ対応・画面整理 ===== */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
#app{padding:8px}
.px{padding:8px;margin-bottom:8px}
.hdr{gap:6px;padding:5px 10px;margin-bottom:6px;font-size:13px}
.hdr .sch{font-size:17px}
.hdr .itm{padding:1px 6px}
.hdr .shortnm{display:none}
.nav{flex-wrap:nowrap;overflow-x:auto;gap:3px;margin-bottom:8px;scrollbar-width:thin;padding-bottom:4px}
.nav button{font-size:12px;padding:3px 7px;white-space:nowrap;flex:none;margin:1px}
.nav button .ni{margin-right:2px}
.nav button.more,.navmore{display:none}
.nav button{position:relative}
.nav .dot{position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:#e8341a;border:1px solid #000}
/* ホーム */
.home{display:grid;grid-template-columns:max-content minmax(300px,1fr);gap:10px;align-items:start}
.hmain{min-width:0}
.hside .px h2{font-size:15px}
.qstat{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.qstat>span{background:#fff;border:2px solid #000;padding:0 6px;font-size:12px}
.qstat .mini{margin:0}
.cal .cell{height:58px;cursor:pointer}
.ctip{color:#fff;font-size:12px;margin:4px 0;min-height:1.4em}
.ctip a{color:#ffe35a}
.hand{margin-top:8px}
.prev{margin-top:8px}
.prev .big{margin-top:4px}
details.fold>summary{cursor:pointer;background:var(--panel);border:3px solid #000;padding:6px 8px;font-weight:bold;margin-bottom:6px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:' ▼';font-size:12px}
details.fold[open]>summary::after{content:' ▲'}
/* 試合 */
.mhead{margin-bottom:6px;padding:6px 8px}
.mhead .mtitle{color:#fff;font-weight:bold;font-size:14px;margin-bottom:4px}
.mrow{display:flex;gap:10px;align-items:flex-start}
.mleft{flex:0 1 720px;min-width:0}
#court{width:100%;height:auto}
.mctl{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin:6px 0;padding:4px 6px}
.mctl button{font-size:12px;padding:4px 8px}
.log{height:150px}
.mpanel{flex:1 1 330px;min-width:0;max-width:none;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);overflow:auto;margin-bottom:0}
.score .shortnm{display:none}
.pmgo{position:sticky;bottom:0;z-index:30}
@media (max-width:720px){
  body{font-size:13px;background-size:12px 12px}
  #app{padding:4px 4px calc(64px + env(safe-area-inset-bottom))}
  h2{font-size:15px;margin-bottom:6px}
  h3{font-size:14px}
  .px{padding:6px;margin-bottom:6px;border-width:3px;box-shadow:3px 3px 0 #000;overflow-x:auto}
  button{font-size:13px;padding:5px 9px}
  button.big{font-size:15px;padding:8px 12px}
  input,select{font-size:16px;padding:3px;max-width:100%}
  th,td{padding:2px 3px;font-size:12px}
  .row{gap:6px}
  .col{min-width:0;flex-basis:100%}
  /* ヘッダー：2行以内 */
  .hdr{gap:3px 4px;padding:4px 6px;font-size:12px;border-width:3px;box-shadow:3px 3px 0 #000;margin-bottom:4px}
  .hdr .sch{font-size:14px;width:100%}
  .hdr .sch small,.hdr .fullnm,.hdr .opt{display:none}
  .hdr .shortnm{display:inline}
  .hdr .itm{padding:0 4px;border-width:1px}
  /* ナビ：画面下に固定 */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:3px 3px calc(3px + env(safe-area-inset-bottom));background:var(--dark);border-top:3px solid #000;overflow:visible;justify-content:space-around}
  .nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:3px 0;min-width:0;box-shadow:2px 2px 0 #000}
  .nav button .ni{font-size:18px;margin:0;line-height:1.1}
  .nav button.sec{display:none}
  .nav button.more{display:flex}
  .navmore{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;position:fixed;left:4px;right:4px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:41;background:var(--panel);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:6px}
  .navmore button{font-size:12px;padding:8px 2px;margin:0;position:relative}
  /* ホーム */
  .home{display:block}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr));width:100%;gap:2px;border-width:3px;box-shadow:3px 3px 0 #000}
  .cal .cell{height:46px;padding-top:9px}
  .cell .wk{font-size:10px;left:2px}
  .cell .ic{font-size:15px}
  .cell .tn,.cell .sb{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px}
  .cell .me{font-size:12px}
  .ctip{font-size:12px;margin:3px 0}
  .hand{flex-wrap:nowrap;gap:4px;margin-top:6px}
  .card{flex:1 1 0;min-width:0;width:auto;height:88px;padding:4px 1px;border-width:3px;box-shadow:2px 2px 0 #000}
  .card.sel{transform:translateY(-5px)}
  .card .n{font-size:28px}
  .card .ck{font-size:11px;word-break:break-all}
  .card .cm{font-size:11px}
  .prev{font-size:12px}
  .prev .big{width:100%}
  .qstat>span{font-size:12px;padding:0 4px}
  /* 試合 */
  .mrow{flex-direction:column;gap:6px}
  .mleft{flex:none;width:100%}
  .mpanel{flex:none;width:100%;max-height:none}
  .score{gap:3px;font-size:13px;flex-wrap:nowrap}
  .score .tm{min-width:0;flex:1 1 0;font-size:12px;padding:3px 4px;border-width:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .score .fullnm{display:none}.score .shortnm{display:inline}
  .score .pt{font-size:26px;min-width:38px;padding:0 4px}
  .score .st{font-size:15px}

        }
        if (p.injury > 0) {

                notes.push(`💪 ${dispName(p, s.players)}がケガから復帰！`);

                v *= 2;

            notes.push(`🩹 ${dispName(p, s.players)}が筋トレで体が強くなり「ケガしやすい」を克服！`);
        }

        for (const sl of SLOTS) {

function drawIdle() {

function rnd(a, b) { return a + Math.random() * (b - a); }
function touchPoint(tc, H, prev) {
    const L = tc.s === 0;
    const home = tc.e && H.get(tc.e) ? H.get(tc.e) : { x: L ? 200 : 520, y: 190 };
    switch (tc.k) {
        case 'serve': return { x: home.x + (L ? 10 : -10), y: home.y, h: 30, move: false };
        case 'recv':
        case 'dig': return { x: home.x + rnd(-14, 14), y: home.y + rnd(-14, 14), h: 8, move: true };
        case 'set': return { x: L ? 328 : 392, y: L ? 232 : 148, h: 38, move: true };
        case 'atk': return { x: L ? 336 : 384, y: clamp(home.y, 80, 300), h: 50, move: true };
        case 'block': return { x: L ? 350 : 370, y: prev ? prev.y : 190, h: 50, move: true };
        case 'land': return tc.near ? { x: L ? rnd(300, 345) : rnd(375, 420), y: rnd(80, 300), h: 0 } : { x: L ? rnd(80, 330) : rnd(390, 640), y: rnd(70, 315), h: 0 };
        case 'out': return { x: L ? rnd(668, 705) : rnd(15, 52), y: rnd(40, 340), h: 0 };

function animateRally(rally) {
    const mt = ui.match, m = mt.m;
    const cv = $('court');
    if (!cv)
        return Promise.resolve();
    const ctx = cv.getContext('2d');
    const snap = rally.snap;
    const H = homesFor(snap);
    for (const [e, h] of H)
        mt.pos.set(e.p.id, { x: h.x, y: h.y });
    const pts = [];
    let prev = null;
    for (const tc of rally.path) {
        const p = touchPoint(tc, H, prev);
        p.tc = tc;
        pts.push(p);
        prev = p;
    }
    const n = pts.length;
    const segDur = Math.max(60, Math.min(mt.mode === 'all' ? 330 : 280, 2600 / n) / (mt.rate || 1));
    const pre = [...rally.sc];
    pre[rally.w]--;
    pre.set = rally.set;
    const anim = { skip: false };
    mt.anim = anim;
    return new Promise(resolve => {
        let i = 0, t0 = performance.now();
        function frame(now) {
            if (anim.skip || ui.match !== mt || !$('court')) {
                mt.anim = null;
                resolve();
                return;
            }
            let t = (now - t0) / segDur;
            if (t >= 1) {
                i++;
                t0 = now;
                t = 0;
                if (i >= n - 1) {
                    const w = rally.w;
                    /* v13 フェーズ2：決着時は自陣・相手陣を喜ぶ／悔しがるポーズに */
                    const poses = new Map();
                    for (const [e, h] of H) poses.set(e, (h.s === 0) === (w === 0) ? 'win' : 'lose');
                    mt.poses = poses;
                    fxBurst('point', w === 0 ? 'POINT!' : 'LOST…', '', w === 0 ? '#ffe35a' : '#9ad0ff');
                    mt.banner.until = Date.now() + 450; mt.banner.dur = 450;
                    drawScene(ctx, m, snap, pts[n - 1], null, Object.assign([...rally.sc], { set: rally.set }));
                    setTimeout(() => { mt.anim = null; resolve(); }, Math.max(120, 420 / (mt.rate || 1)));
                    return;
                }
            }
            const a = pts[i], b = pts[Math.min(i + 1, n - 1)];
            const arc = (b.tc.k === 'land' && a.tc.k === 'atk') ? 6 : (b.tc.k === 'out' ? 20 : (a.tc.k === 'serve' ? 55 : 45));
            const ball = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, h: a.h + (b.h - a.h) * t + Math.sin(Math.PI * t) * arc };
            // 選手の移動
            for (const [e, h] of H) {
                const p = mt.pos.get(e.p.id);
                let tx = h.x, ty = h.y;
                if (e === b.tc.e && b.move) {
                    tx = b.x;
                    ty = b.y;
                }
                else if (e === a.tc.e && a.move && t < 0.4) {
                    tx = a.x;
                    ty = a.y;
                }
                if (a.tc.k === 'serve' && e === a.tc.e && i > 0) {
                    tx = HOME[a.tc.s][0][0];
                    ty = HOME[a.tc.s][0][1];
                }
                if (i > 0 && snap.serving !== undefined && e === snap.courts[snap.serving][0] && h.x === SERVE_POS[snap.serving][0]) {
                    tx = HOME[snap.serving][0][0];
                    ty = HOME[snap.serving][0][1];
                }
                p.x += (tx - p.x) * 0.18;
                p.y += (ty - p.y) * 0.18;
            }
            const hop = (b.tc.k === 'atk' || b.tc.k === 'block') && t > 0.6 ? b.tc.e : null;
            /* v13 フェーズ2：今のタッチをする選手にポーズを付ける。動く選手は移動ポーズ */
            const poses = new Map();
            for (const [e, h] of H) {
                let ps = 'idle';
                if (e === b.tc.e) ps = poseOfTouch(b.tc.k);
                else if (e === a.tc.e && a.move && t < 0.4) ps = 'move';
                poses.set(e, ps);
            }
            mt.poses = poses;
            drawScene(ctx, m, snap, ball, hop, pre);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    });
}

let focusSel = null;
function focusShares(list) {
    const fm = FOCUS_MULT[Math.min(list.length, FOCUS_MULT.length - 1)];
    const jis = list.includes('jissen');
    const act = ACTION_SHARE * (jis ? 1 + 0.5 * fm / 2.4 : 1);
    const rest = (1 - act) * REST_P;
    const keys = Object.keys(CARD_W).filter(k => k !== 'rest');
    const w = keys.map(k => CARD_W[k] * (list.includes(k) ? fm : 1));
    const tw = w.reduce((a, b) => a + b, 0);
    const out = {};
    keys.forEach((k, i) => out[k] = (1 - act - rest) * w[i] / tw);
    out.rest = rest;
    out.action = act;
    return out;
}

/* ---------- v13 フェーズ4：PWA（Service Worker 登録と更新通知） ----------
   登録に失敗しても（file:// 直開き・非対応ブラウザなど）静かに無視し、ゲームは止めない。
   更新時は新しい Service Worker をすぐ有効化せず、ゲーム内通知（モーダル）で知らせ、
   ユーザーが「今すぐ更新する」を押したときだけ切り替えて再読み込みする。 */
let swReg = null, swUpdateShown = false, swReloading = false;
function registerSW() {
    try {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (swReloading) return; swReloading = true; window.location.reload();
        });
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { scope: './' }).then(reg => {
                swReg = reg;
                if (reg.waiting) notifySWUpdate();
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    if (!nw) return;
                    nw.addEventListener('statechange', () => {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller) notifySWUpdate();
                    });
                });
            }).catch(() => { /* 登録失敗時はオフライン機能なしでそのまま遊べる */ });
        });
    } catch (e) { /* Service Worker 非対応・例外時もゲームは止めない */ }
}
function notifySWUpdate() {
    if (swUpdateShown) return; swUpdateShown = true;
    queueModal(`<h2>🔄 新しいバージョンがあります</h2><p>女子バレー部監督シム v13.4 の更新が届きました。再読み込みすると新しいバージョンになります。セーブデータはそのまま残ります。</p><p><button class="big" onclick="applySWUpdate()">今すぐ更新する</button> <button class="sub" onclick="nextModal()">あとで</button></p>`);
}
function applySWUpdate() {
    try { if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
    closeModal();
    /* controllerchange が来ない環境向けの保険：少し待って再読み込みする。 */
    setTimeout(() => { if (!swReloading) window.location.reload(); }, 1500);
}
async function boot() {
    registerSW();
    $('app').innerHTML = '<div class="title"><h1>読み込み中…</h1></div>';
    try {
        loadPrefs();
        applyPrefs();
        await STORE.init();
        await refreshSlots();
        ui.oldSaveFound = await detectOldSave();

        console.error(e);
    }

}

function playerStatsHtml() {
    const car = ui.recCar;
    const L = sortedPlayers().filter(p => !p.retired).map(p => ({ p, d: car ? p.car : (p.seas && p.seas.y === S.year ? p.seas : null) }));
    return `<p><button class="mini ${car ? 'sub' : 'on'}" onclick="ui.recCar=false;render()">今季（${S.year}年目）</button><button class="mini ${car ? 'on' : 'sub'}" onclick="ui.recCar=true;render()">通算</button> <span class="sm">公式戦・練習試合の合計</span></p>
  <div style="overflow:auto"><table class="antbl"><tr><th>選手</th><th>試合</th><th>打数</th><th>決定率</th><th>効果率</th><th>サーブ</th><th>エース</th><th>ミス</th><th>受数</th><th>Aパス率</th><th>ブロック</th><th>ディグ</th></tr>
  ${L.map(({ p, d }) => d ? `<tr><td class="nmc">${avatar(p, 22)} ${esc(dn(p))}</td><td>${d.g}</td><td>${d.atk || 0}</td><td>${rateTxt(d.kill || 0, d.atk)}</td><td>${effTxt({ atk: d.atk || 0, kill: d.kill || 0, err: d.err || 0, blkd: d.blkd || 0 })}</td><td>${d.srv || 0}</td><td>${d.ace || 0}</td><td>${d.serr || 0}</td><td>${d.rcv || 0}</td><td>${rateTxt(d.rA || 0, d.rcv)}</td><td>${d.blk || 0}</td><td>${d.dig || 0}</td></tr>` : `<tr><td class="nmc">${avatar(p, 22)} ${esc(dn(p))}</td><td colspan="11" class="sm">出場なし</td></tr>`).join('')}</table></div>`;
}

/* ---------- v12-4：卒業生の詳細（殿堂・アルバム・名鑑から） ---------- */
function openAlumni(i) {
    const a = S.alumni[i];
    if (!a) return;
    const st = a.stats || {};
    const pr = a.prof || {};
    const r = a.rec || null;
    const an = a.an || null;
    const skills = a.skills || [];
    const gold = skills.filter(s => SKG[s]).length;
    const sum = STATS.reduce((x, k) => x + (st[k] || 0), 0);
    const best = STATS.filter(k => st[k] != null).sort((x, y) => st[y] - st[x]).slice(0, 2);
    const peers = S.alumni.filter(x => x.year === a.year);
    const sameYearRank = [...peers].sort((x, y) => y.ovr - x.ovr).indexOf(a) + 1;
    showModal(`<div style="float:right;text-align:center;margin:0 0 6px 10px">${a.face ? `<span class="pt-face">${faceSVG(a.face, 'smile', teamColor(), 140)}</span>` : ''}</div>
  <h2>${a.hof ? '⭐ ' : ''}${esc(a.name)}（${a.year}年目卒・${POS_JP[a.pos] || a.pos}）</h2>
  ${a.title ? `<p class="ttl" style="font-size:15px">🏷 二つ名「${esc(a.title)}」</p>` : ''}
  <p>${a.hof ? '<span class="tag" style="background:#ffd84a">⭐ 殿堂入り</span>' : ''}<span class="tag">進路：${esc(a.career || '')}</span>${a.height ? `<span class="tag">身長 ${a.height}cm</span>` : ''}${a.hand ? `<span class="tag">${a.hand}利き</span>` : ''}${a.pers ? `<span class="tag">性格：${esc(a.pers)}</span>` : ''}${a.growth ? `<span class="tag">成長：${a.growth}</span>` : ''}<span class="tag">出場 ${a.matches || 0}試合</span></p>
  ${pr.hobby ? `<div class="prof"><span>🎂 ${esc(pr.birth || '')}</span><span>🏫 ${esc(pr.school || '')}出身</span><span>🎨 趣味：${esc(pr.hobby)}</span><span>🍽 好物：${esc(pr.food || '')}</span><span>📚 得意科目：${esc(pr.subject || '')}</span></div>` : ''}
  <h3 style="clear:both">📈 卒業時の能力（総合 ${rk(a.ovr)} ${a.ovr}／合計 ${sum}）</h3>
  <table><tr><th>能力</th><th>値</th><th style="width:50%"></th></tr>${STATS.map(k => `<tr${best.includes(k) ? ' class="me"' : ''}><td>${STAT_JP[k]}</td><td>${st[k] != null ? `${rk(st[k])} ${st[k]}` : '—'}</td><td><div class="bar"><i style="width:${st[k] || 0}%;background:${(st[k] || 0) >= 90 ? '#e83a3a' : (st[k] || 0) >= 80 ? '#ff8c1a' : '#4cb84c'}"></i></div></td></tr>`).join('')}</table>
  ${a.apt ? `<p class="sm">ポジション適性：${POS.map(q => `${POS_JP[q]} ${APT_MARK[a.apt[q] ?? 0]}`).join('　')}</p>` : ''}
  <h3>✨ 特殊能力（金${gold}／全${skills.length}）</h3><div>${skills.length ? skTagsHtml({ skills }) : '<span class="sm">なし</span>'}</div>
  <div class="sm" style="margin:4px 0">${skills.map(s => { const x = skillInfo(s); return `・${esc(x.name)}：${esc(x.desc)}`; }).join('<br>')}</div>
  <h3>🏐 記録</h3>
  ${r ? `<p class="sm">公式戦通算：${r.g}試合 ${r.pts}得点（アタック${r.kill}／ブロック${r.blk}／サーブ${r.ace}）</p>` : ''}
  ${an ? `<table class="antbl"><tr><th>試合</th><th>打数</th><th>決定率</th><th>効果率</th><th>サーブ</th><th>エース</th><th>受数</th><th>Aパス率</th><th>ブロック</th><th>ディグ</th></tr>
   <tr><td>${an.g}</td><td>${an.atk || 0}</td><td>${rateTxt(an.kill || 0, an.atk)}</td><td>${effTxt({ atk: an.atk || 0, kill: an.kill || 0, err: an.err || 0, blkd: an.blkd || 0 })}</td><td>${an.srv || 0}</td><td>${an.ace || 0}</td><td>${an.rcv || 0}</td><td>${rateTxt(an.rA || 0, an.rcv)}</td><td>${an.blk || 0}</td><td>${an.dig || 0}</td></tr></table><p class="sm">公式戦・練習試合の合計（データ分析）</p>` : '<p class="sm">データ分析の通算記録は v13 以降に卒業した選手から残ります</p>'}
  <p class="sm">同期 ${peers.length}人中、総合 ${sameYearRank}位</p>
  ${a.words ? `<div class="awords">「${esc(a.words)}」</div>` : ''}
  <p><button onclick="closeModal()">閉じる</button></p>`);
}

/* ---------- 起動 ---------- */
boot();

</script>
</body>
</html>
